services:
  server:
    build: .
    container_name: devblog-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:6969:6969"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6969/api/debug/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
